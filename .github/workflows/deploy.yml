name: Deploy to VPS

on:
  push:
    branches:
      - dental_academico

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/site-academico-servidor
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Restart container on VPS with pulled image
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_DENTAL_ACADEMICO }}
          port: ${{ secrets.VPS_PORT_SOLIDENT }}
          username: ${{ secrets.VPS_USER_DENTAL_ACADEMICO }}
          password: ${{ secrets.VPS_PASS_DENTAL_ACADEMICO }}
          script: |
            set -e
            echo '${{ secrets.GHCR_TOKEN }}' | podman login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin
            podman pull ghcr.io/${{ github.repository_owner }}/site-academico-servidor:latest
            if podman container exists site-academico-servidor; then
              podman rm -f site-academico-servidor
            fi

            podman network exists solident-network || podman network create solident-network

            ENV_FILE="/opt/solident/env/site-academico-servidor.env"
            ENV_ARG=""
            if [ -f "$ENV_FILE" ]; then
              ENV_ARG="--env-file $ENV_FILE"
            fi

            podman run -d \
              --name site-academico-servidor \
              --restart=always \
              --network solident-network \
              -p 3002:3002 \
              $ENV_ARG \
              ghcr.io/${{ github.repository_owner }}/site-academico-servidor:latest
